services:
  - type: web
    name: jansevaai
    runtime: docker
    plan: free
    envVars:
      - key: JANSEVA_ADMIN_TOKEN
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: IMAP_HOST
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
